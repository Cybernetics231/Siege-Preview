<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siege Preview</title>
<link rel="stylesheet" href="css/holo.css">
<style>
  .facGrid.two { grid-template-columns: repeat(2, 1fr); }
  .facGrid.two .facCard .portrait { height: 96px; }
  #skirmish .mapSeg { margin-bottom: 10px; }
  #skirmish .mapSeg button { padding: 8px 6px; line-height: 1.3; }
  #skirmish .mapSeg button small { display: block; font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: none; }
  #skirmish .mapSeg button.on small { color: inherit; }
  .oppCard { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .oppCard .portrait { width: 72px; height: 72px; flex: none; }
  .oppCard .name { font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: var(--red); }
  .howto { margin-top: 16px; line-height: 1.5; }
  .howto b { color: var(--text); font-weight: 400; }
</style>
</head>
<body>

<div id="menus" class="screen">
  <canvas id="menuBg"></canvas>
  <div class="scan"></div>
  <div class="audioBtn seg"><button id="aMusic">Music</button><button id="aSfx">SFX</button></div>

  <!-- ================= MAIN MENU ================= -->
  <div id="mainMenu" class="screen">
    <div class="stack">
      <div class="logo">SIEGE<br><span>PREVIEW</span></div>
      <div class="tag">Tech demo · real-time tactics on real ground</div>
      <button id="mSkirmish" class="brackets">Skirmish<small>The NWR against the Order on three famous battlefields, in Realism</small></button>
      <button id="mArmory" class="brackets">Armory<small>Both sides' rosters, phases, abilities and lore</small></button>
    </div>
    <div class="feed" id="feed"></div>
    <div class="ver">Tech demo · V0.53</div>
  </div>

  <!-- ================= SKIRMISH SET-UP ================= -->
  <div id="skirmish" class="screen hidden">
    <header>
      <button id="sBack">◂ Back</button>
      <h1>SKIRMISH <span>SET-UP</span></h1>
      <div class="dim">You deploy from the south edge · the enemy from the north</div>
    </header>
    <div class="cols">
      <div class="col glass brackets">
        <div class="label">Your side</div>
        <div class="facGrid two" id="myFacs"></div>
        <div id="myFacInfo" class="facInfo"></div>
      </div>
      <div class="col glass brackets" id="preview">
        <div class="label">Battlefield</div>
        <div class="seg mapSeg" id="mapSeg"></div>
        <canvas id="previewCv"></canvas>
        <div id="previewInfo"></div>
      </div>
      <div class="col glass brackets">
        <div class="label">Opponent</div>
        <div class="oppCard" id="oppInfo"></div>
        <div class="setting"><div class="label">Difficulty</div><div class="seg" id="diffSeg"></div><div class="dim small" id="diffInfo"></div></div>
        <div class="setting"><div class="label">Game mode · Realism</div><div class="modeCard" id="modeInfo"></div></div>
        <button id="sDeploy" class="primary">Deploy</button>
        <div class="howto dim small" id="howto"></div>
      </div>
    </div>
  </div>

  <!-- ================= ARMORY ================= -->
  <div id="armory" class="screen hidden">
    <header>
      <button id="arBack">◂ Back</button>
      <h1>THE <span>ARMORY</span></h1>
      <div class="seg" id="arTabs"></div>
    </header>
    <div class="arCols">
      <div class="col glass brackets" id="arList"></div>
      <div class="col glass brackets" id="arDetail"></div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
